<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>开始使用徐医校园网助手</title>
  <link rel="stylesheet" href="design-tokens.css">
  <link rel="stylesheet" href="welcome.css">
</head>
<body class="app-themed-page">
  <main class="welcome-shell">
    <section class="welcome-brand" aria-hidden="true">
      <span class="welcome-blob welcome-blob-a"></span>
      <span class="welcome-blob welcome-blob-b"></span>
      <div class="welcome-brand-stage">
        <div class="drcom-characters welcome-characters" aria-hidden="true">
          <div class="drcom-char char-purple"><span class="char-eyes"><span class="char-eye"><span class="char-pupil"></span></span><span class="char-eye"><span class="char-pupil"></span></span></span><span class="char-mouth"></span></div>
          <div class="drcom-char char-black"><span class="char-eyes"><span class="char-eye"><span class="char-pupil"></span></span><span class="char-eye"><span class="char-pupil"></span></span></span><span class="char-mouth"></span></div>
          <div class="drcom-char char-orange"><span class="char-eyes"><span class="char-eye"><span class="char-pupil"></span></span><span class="char-eye"><span class="char-pupil"></span></span></span><span class="char-mouth"></span></div>
          <div class="drcom-char char-yellow"><span class="char-eyes"><span class="char-eye"><span class="char-pupil"></span></span><span class="char-eye"><span class="char-pupil"></span></span></span><span class="char-mouth"></span></div>
        </div>
        <div class="welcome-lockup">
          <strong>徐医校园网助手</strong>
          <span>连接校园网，从这里开始</span>
        </div>
      </div>
    </section>

    <section class="welcome-content" aria-labelledby="welcome-title">
      <div class="intro">
        <h1 id="welcome-title">先登录校园网</h1>
        <p>第一次使用只需要完成一次网页登录。助手会识别登录请求并保存必要参数，以后可以快速连接。</p>
      </div>

      <ol class="setup-steps">
        <li>
          <span class="step-number" aria-hidden="true">1</span>
          <strong>打开认证页</strong>
          <span>进入学校校园网网关。</span>
        </li>
        <li>
          <span class="step-number" aria-hidden="true">2</span>
          <strong>输入账号并登录</strong>
          <span>使用你的学号、运营商后缀和认证密码。</span>
        </li>
        <li>
          <span class="step-number" aria-hidden="true">3</span>
          <strong>完成首次登录</strong>
          <span>账号和网络参数会在登录请求发出后自动保存。</span>
        </li>
      </ol>

      <aside class="portal-panel" aria-labelledby="portal-title">
        <div class="portal-panel-copy">
          <p class="panel-label">校园网认证地址</p>
          <h2 id="portal-title">10.10.10.2</h2>
          <p>请确保设备已经连接学校有线网络或校园 Wi-Fi。</p>
        </div>
        <div class="welcome-actions">
          <button id="open-portal" class="primary-action" type="button">打开 10.10.10.2 并登录</button>
          <button id="open-options" class="secondary-action" type="button">先查看设置</button>
        </div>
      </aside>

      <p class="privacy-note">账号数据只保存在这台设备的浏览器中。</p>
    </section>
  </main>
  <script src="appearance.js"></script>
  <script src="welcome.js"></script>
</body>
</html>
