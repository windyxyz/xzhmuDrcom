<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="welcome_page_title">开始使用xzhmu徐医校园网</title>
  <link rel="stylesheet" href="design-tokens.css">
  <link rel="stylesheet" href="welcome.css">
</head>
<body class="app-themed-page">
  <main class="welcome-shell">
    <section class="welcome-brand" aria-hidden="true">
      <span class="welcome-blob welcome-blob-a"></span>
      <span class="welcome-blob welcome-blob-b"></span>
      <div class="welcome-brand-stage">
        <div class="dchar-frame welcome-characters" data-characters aria-hidden="true"></div>
        <div class="welcome-lockup">
          <strong data-i18n="brand_name">xzhmu徐医校园网</strong>
          <span data-i18n="welcome_tagline">连接校园网，从这里开始</span>
        </div>
      </div>
    </section>

    <section class="welcome-content" aria-labelledby="welcome-title">
      <div class="intro">
        <button id="language-toggle" class="welcome-language-toggle" type="button" data-i18n-aria-label="language_switch_bilingual">EN</button>
        <h1 id="welcome-title" data-i18n="welcome_heading">先登录校园网</h1>
        <p data-i18n="welcome_intro">第一次使用只需要完成一次网页登录。助手会识别登录请求并保存必要参数，以后可以快速连接。</p>
      </div>

      <ol class="setup-steps">
        <li>
          <span class="step-number" aria-hidden="true">1</span>
          <strong data-i18n="welcome_step_open">打开认证页</strong>
          <span data-i18n="welcome_step_open_detail">进入学校校园网网关。</span>
        </li>
        <li>
          <span class="step-number" aria-hidden="true">2</span>
          <strong data-i18n="welcome_step_credentials">输入账号并登录</strong>
          <span data-i18n="welcome_step_credentials_detail">使用你的学号、运营商后缀和认证密码。</span>
        </li>
        <li>
          <span class="step-number" aria-hidden="true">3</span>
          <strong data-i18n="welcome_step_finish">完成首次登录</strong>
          <span data-i18n="welcome_step_finish_detail">原页面捕获会暂存并打开确认；现代页面仅在勾选保存时写入。</span>
        </li>
      </ol>

      <aside class="portal-panel" aria-labelledby="portal-title">
        <div class="portal-panel-copy">
          <p class="panel-label" data-i18n="welcome_gateway_label">校园网认证地址</p>
          <h2 id="portal-title">10.10.10.2</h2>
          <p data-i18n="welcome_network_hint">请确保设备已经连接学校有线网络或校园 Wi-Fi。</p>
        </div>
        <div class="welcome-actions">
          <button id="open-portal" class="primary-action" type="button">打开 10.10.10.2 并登录</button>
          <button id="open-options" class="secondary-action" type="button" data-i18n="welcome_settings">先查看设置</button>
        </div>
      </aside>

      <p class="privacy-note" data-i18n="welcome_privacy">账号数据只保存在这台设备的浏览器中。</p>
    </section>
  </main>
  <script src="i18n-messages.js"></script>
  <script src="i18n.js"></script>
  <script src="appearance.js"></script>
  <script src="animated-characters.js"></script>
  <script src="welcome.js"></script>
</body>
</html>
