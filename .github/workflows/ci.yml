name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Static checks
        run: npm run check
      - name: Unit tests
        run: npm run test:unit
      - name: Browser tests
        run: npm run test:browser
        env:
          # 强制门禁：runner 上没有可用浏览器或 Node 缺少内置 WebSocket 时直接 fail，
          # 防止浏览器测试被静默 skip 后 CI 依然绿色。
          REQUIRE_BROWSER_TESTS: "1"
      - name: Reproducible package tests
        run: npm run verify:package
      - name: Build release assets
        run: npm run package
      - name: Build Firefox release asset
        run: npm run package:firefox
      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: drcom-extension-packages
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
