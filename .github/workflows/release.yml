name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tag
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Verify source and package contract
        run: npm run verify
      - name: Build release assets
        run: npm run package
      - name: Verify tag and extract changelog
        run: npm run verify:release -- "$GITHUB_REF_NAME"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*.zip
          dist/*.sha256
          --verify-tag
          --title "DrCom徐医 $GITHUB_REF_NAME"
          --notes-file dist/release-notes.md
